[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# XDC has not shipped every post-merge opcode on every network; "paris"
# avoids PUSH0/MCOPY so the same bytecode deploys to mainnet (50) and Apothem (51).
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[rpc_endpoints]
xdc = "https://rpc.xinfin.network"
apothem = "https://rpc.apothem.network"
