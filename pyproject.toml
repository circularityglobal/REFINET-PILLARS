[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refinet-pillar"
dynamic = ["version"]
description = "Sovereign Gopher mesh node with Ed25519 identity and encrypted mesh networking"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.9"
keywords = ["gopher", "decentralized", "sovereign", "mesh", "p2p", "blockchain", "ed25519"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
]
dependencies = [
    "cryptography>=41.0.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
full = [
    "eth-account>=0.10.0",
    "websockets>=12.0",
    "web3>=6.0.0",
    "stem>=1.8.2",
    "qrcode[pil]>=7.4.2",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.1.0",   # README and CI both run with --timeout
    "pyyaml>=6.0",             # tests/test_workflows.py parses .github/workflows
]

[project.scripts]
refinet-pillar = "pillar:cli"

[project.urls]
Homepage = "https://refinet.io"
Repository = "https://github.com/circularityglobal/REFINET-PILLARS"
Documentation = "https://github.com/circularityglobal/REFINET-PILLARS/blob/main/docs/OPERATORS.md"
Issues = "https://github.com/circularityglobal/REFINET-PILLARS/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools]
# `refinet-pillar = "pillar:cli"` points at pillar.py, a top-level module.
# packages.find cannot see a loose module, so without this the console
# script installs and then fails to import.
py-modules = ["pillar"]

[tool.setuptools.packages.find]
# onboarding and vault were missing: pillar.py imports onboarding at start-up,
# so a wheel without it installed a CLI that could not run.
include = ["core*", "crypto*", "db*", "auth*", "mesh*", "rpc*", "cli*", "proxy*",
           "integration*", "monitor*", "onboarding*", "vault*"]

[tool.setuptools.dynamic]
version = {attr = "core.version.__version__"}
