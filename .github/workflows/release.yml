name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[test]'   # pytest-timeout and pyyaml live here

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -q --timeout=60

      # A release must not ship a version the CHANGELOG still calls
      # unreleased: 0.5.0 and 0.6.0 both sat there while tags went out.
      - name: Refuse a tag the CHANGELOG has not released
        run: |
          version="${GITHUB_REF_NAME#v}"
          if grep -qiE "^## \\[${version}\\].*unreleased" CHANGELOG.md; then
            echo "::error title=CHANGELOG::[${version}] is still marked Unreleased."
            exit 1
          fi
          grep -qE "^## \\[${version}\\]" CHANGELOG.md || {
            echo "::error title=CHANGELOG::No [${version}] section found."
            exit 1
          }

  # The contract holds operator funds; the release path gates on the same
  # checks test.yml does, not on pytest alone.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install contract dependencies
        working-directory: contracts
        run: forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 foundry-rs/forge-std@v1.16.2 --no-git
      - name: Run contract tests
        working-directory: contracts
        run: forge test -vv
      - name: Check invariants
        working-directory: contracts
        run: forge test --match-contract PillarStakingInvariantTest -vv

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run SDK tests
        working-directory: sdk/js
        run: npm test

  build-windows-exe:
    needs: test
    continue-on-error: true
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows .exe
        run: python build/build_exe.py

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/refinet-pillar-setup.exe
          retention-days: 1

  build-macos-dmg:
    needs: test
    continue-on-error: true
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS .dmg
        run: python build/build_dmg.py

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/refinet-pillar.dmg
          retention-days: 1

  build-linux-deb:
    needs: test
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux .deb
        run: python build/build_deb.py

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/refinet-pillar.deb
          retention-days: 1

  build-linux-appimage:
    needs: test
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Build Linux AppImage
        run: python build/build_appimage.py

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/refinet-pillar.AppImage
          retention-days: 1

  build-android-apk:
    needs: test
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev cmake libffi-dev libssl-dev automake

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install buildozer cython

      - name: Build Android APK
        run: python build/build_apk.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/refinet-pillar.apk
          retention-days: 1

  release:
    needs: [test, contracts, sdk, build-windows-exe, build-macos-dmg, build-linux-deb,
            build-linux-appimage, build-android-apk]
    # The desktop and mobile builders stay best-effort, but a release is not
    # allowed past a failing test, contract or SDK job. refinet.io links
    # directly to these artifacts, so a green release with none of them
    # attached is a broken download page.
    if: always() && needs.test.result == 'success' && needs.contracts.result == 'success'
        && needs.sdk.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all available artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Create release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix=refinet-pillar/ HEAD \
            > "refinet-pillar-${VERSION}.tar.gz"

      - name: Generate checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          sha256sum "refinet-pillar-${VERSION}.tar.gz" > CHECKSUMS.txt
          for f in artifacts/refinet-pillar-setup.exe artifacts/refinet-pillar.dmg \
                   artifacts/refinet-pillar.deb artifacts/refinet-pillar.AppImage \
                   artifacts/refinet-pillar.apk; do
            [ -f "$f" ] && sha256sum "$f" >> CHECKSUMS.txt
          done
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            refinet-pillar-*.tar.gz
            artifacts/refinet-pillar-setup.exe
            artifacts/refinet-pillar.dmg
            artifacts/refinet-pillar.deb
            artifacts/refinet-pillar.AppImage
            artifacts/refinet-pillar.apk
            CHECKSUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false

  publish-pypi:
    needs: [test, contracts, sdk]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          pip install build twine
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --verbose dist/*

  publish-docker:
    needs: [test, contracts, sdk]
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            refinet/pillar:${{ steps.version.outputs.VERSION }}
            refinet/pillar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
