name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e '.[test]'

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -q --timeout=60

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install contract dependencies
        working-directory: contracts
        run: forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 foundry-rs/forge-std@v1.16.2 --no-git

      - name: Run contract tests
        working-directory: contracts
        run: forge test -vv

      # The contract holds operator funds, so the stateful invariants are
      # part of the gate, not an optional extra.
      - name: Check invariants
        working-directory: contracts
        run: forge test --match-contract PillarStakingInvariantTest -vv

      - name: Coverage
        working-directory: contracts
        run: forge coverage --report summary --no-match-coverage "(test|script)"

      # Report-only to begin with. Tighten to `fail-on: medium` once a clean
      # run has been seen in CI -- it has not been verified locally.
      - name: Static analysis
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: none

  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run SDK tests
        working-directory: sdk/js
        run: npm test
