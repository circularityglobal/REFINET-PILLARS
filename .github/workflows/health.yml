name: Pillar Health

# Reports whether the bootstrap Pillar is answering, and keeps the README
# badge honest. A Pillar that is down is the result this monitor exists to
# report, so it is recorded in the badge — not raised as a workflow failure.
#
# GitHub disables a scheduled workflow after 60 days without repository
# activity; it resumes on the next push.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write   # the badge is committed back to the branch

env:
  PILLAR_HOST: ${{ vars.PILLAR_HOST || 'gopher.refinet.io' }}
  PILLAR_PORT: ${{ vars.PILLAR_PORT || '7070' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe the Pillar
        id: probe
        run: |
          if python3 .github/scripts/pillar_probe.py online "$PILLAR_HOST" "$PILLAR_PORT"; then
            echo "status=online"     >> "$GITHUB_OUTPUT"
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
            label="gopher://${PILLAR_HOST}:${PILLAR_PORT}"
          else
            echo "status=offline" >> "$GITHUB_OUTPUT"
            echo "color=red"      >> "$GITHUB_OUTPUT"
            label="${PILLAR_HOST}"
            echo "::notice title=Pillar offline::${PILLAR_HOST}:${PILLAR_PORT} did not answer. The badge now says offline. If no bootstrap Pillar is deployed yet, that is expected — see the Deploy Bootstrap Pillar workflow."
          fi
          # shields.io reads "-" as its field separator and "_" as a space,
          # so both have to be doubled before the label is URL-encoded.
          encoded=$(LABEL="$label" python3 -c "
          import os, urllib.parse
          label = os.environ['LABEL'].replace('-', '--').replace('_', '__')
          print(urllib.parse.quote(label, safe=''))
          ")
          echo "label=$encoded" >> "$GITHUB_OUTPUT"

      - name: Fetch root menu
        if: steps.probe.outputs.status == 'online'
        run: python3 .github/scripts/pillar_probe.py menu "$PILLAR_HOST" "$PILLAR_PORT"

      - name: Fetch /health/services JSON
        if: steps.probe.outputs.status == 'online'
        run: python3 .github/scripts/pillar_probe.py services "$PILLAR_HOST" "$PILLAR_PORT"

      - name: Write status badge
        run: |
          mkdir -p .github/badges
          curl -sSL --fail \
            "https://img.shields.io/badge/${{ steps.probe.outputs.label }}-${{ steps.probe.outputs.status }}-${{ steps.probe.outputs.color }}.svg" \
            -o .github/badges/pillar-status.svg

      - name: Commit badge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/pillar-status.svg
          if git diff --staged --quiet; then
            echo "Badge unchanged; nothing to commit."
          else
            git commit -m "chore: pillar status [skip ci]"
            # Another run on a 15-minute schedule may have pushed in between.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
